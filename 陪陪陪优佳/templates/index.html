  async function sendMessage() {
    const input = document.getElementById('queryInput');
    const query = input.value.trim();
    if (!query) return;

    // Show user message
    addMessage('user', query);
    renderSuggestions([]); // clear previous suggestions

    // Clear input
    input.value = '';
    input.placeholder = '描述你要陪诊的场景，如：我妈妈头晕乏力该挂什么科...';
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('typing').style.display = 'flex';

    try {
      const sessionId = getSessionId();
      const history = getRecentHistory(5);

      const resp = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query,
          mode: 'auto',
          session_id: sessionId,
          history: history
        })
      });
      const data = await resp.json();

      // Hide typing
      document.getElementById('typing').style.display = 'none';

      // Show bot response
      const html = formatBotReply(data);
      addMessage('bot', html, true);

      // Show smart follow-up suggestions
      if (data.suggestions && data.suggestions.length) {
        renderSuggestions(data.suggestions);
      }

      // 语音朗读 AI 回复（answer 场景）
      const div = document.createElement('div');
      div.innerHTML = html;
      const plainAnswer = (div.textContent || '').trim();
      if (plainAnswer) VoiceController.speak(plainAnswer, 'answer');
    } catch (err) {
      document.getElementById('typing').style.display = 'none';
      const errorMsg = addMessage('bot',
        '<div class="disease-name">⚠ 服务连接失败</div>' +
        '请确保服务器已启动（<code>python server.py</code>）。<br><br>' +
        '<button onclick="retryLastQuery()" style="padding:8px 16px;border-radius:20px;border:1px solid #60a5fa;background:rgba(96,165,250,0.2);color:#60a5fa;cursor:pointer;">🔄 重试</button>',
        true);
      window._lastFailedQuery = query;
    }

    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  // ========== SSE Streaming Answer ==========
  async function streamSearch(query) {
    const msgDiv = addMessage('bot', '<span class="typing" style="display:inline-flex;">思考中<span class="dots"><span></span><span></span><span></span></span></span>', true, true);
    const contentEl = msgDiv.querySelector('.msg-content');
    let fullText = '';

    const ABORT_TIMEOUT = 45000; // 45 seconds max for streaming

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), ABORT_TIMEOUT);

      const resp = await fetch('/api/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query }),
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (!resp.ok) {
        throw new Error('HTTP ' + resp.status);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.chunk) {
              fullText += data.chunk;
              contentEl.innerHTML = '<button class="copy-btn" onclick="copyMsgContent(this)">📋 复制</button>'
                + fullText.replace(/\n/g, '<br>')
                + '<div class="feedback-row"><span style="color:#94a3b8;">有帮助吗？</span>'
                + '<button class="fb-btn" onclick="sendFeedback(this,\'good\')">👍</button>'
                + '<button class="fb-btn" onclick="sendFeedback(this,\'bad\')">👎</button></div>';
              const msgs = document.getElementById('messages');
              msgs.scrollTop = msgs.scrollHeight;
            }
            if (data.done && data.suggestions) {
              renderSuggestions(data.suggestions);
            }
          } catch(e) {}
        }
      }

      if (fullText) {
        const now = new Date();
        const ts = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
        contentEl.innerHTML = '<button class="copy-btn" onclick="copyMsgContent(this)">📋 复制</button>'
          + fullText.replace(/\n/g, '<br>')
          + '<span class="msg-time">' + ts + '</span>'
          + '<div class="feedback-row"><span style="color:#94a3b8;">有帮助吗？</span>'
          + '<button class="fb-btn" onclick="sendFeedback(this,\'good\')">👍</button>'
          + '<button class="fb-btn" onclick="sendFeedback(this,\'bad\')">👎</button></div>';
      }
      if (fullText) VoiceController.speak(fullText, 'answer');
    } catch (err) {
      if (err.name === 'AbortError') {
        if (fullText) {
          contentEl.innerHTML = '<button class="copy-btn" onclick="copyMsgContent(this)">📋 复制</button>'
            + fullText.replace(/\n/g, '<br>')
            + '<br><br><span style="color:#fbbf24;">⚠ 回答加载超时，已显示部分结果。</span>'
            + '<span class="msg-time">' + new Date().getHours().toString().padStart(2,'0') + ':'
            + new Date().getMinutes().toString().padStart(2,'0') + '</span>'
            + '<div class="feedback-row"><span style="color:#94a3b8;">有帮助吗？</span>'
            + '<button class="fb-btn" onclick="sendFeedback(this,\'good\')">👍</button>'
            + '<button class="fb-btn" onclick="sendFeedback(this,\'bad\')">👎</button></div>';
        } else {
          // Fallback: try normal search API
          await fallbackSearch(query, contentEl);
          return;
        }
      } else {
        // Stream failed entirely — fallback to normal search
        await fallbackSearch(query, contentEl);
        return;
      }
    }
    saveMessages();
  }

  async function fallbackSearch(query, contentEl) {
    try {
      const resp = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, session_id: getSessionId() })
      });
      const data = await resp.json();
      const html = formatBotReply(data);
      const now = new Date();
      const ts = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      contentEl.innerHTML = '<button class="copy-btn" onclick="copyMsgContent(this)">📋 复制</button>'
        + html
        + '<span class="msg-time">' + ts + '</span>'
        + '<div class="feedback-row"><span style="color:#94a3b8;">有帮助吗？</span>'
        + '<button class="fb-btn" onclick="sendFeedback(this,\'good\')">👍</button>'
        + '<button class="fb-btn" onclick="sendFeedback(this,\'bad\')">👎</button></div>';
      if (data.suggestions && data.suggestions.length) {
        renderSuggestions(data.suggestions);
      }
    } catch (e2) {
      contentEl.innerHTML = '⚠ 服务连接失败，请刷新页面重试。';
    }
    saveMessages();
  }

  function retryLastQuery() {
    const q = window._lastFailedQuery;
    if (!q) return;
    window._lastFailedQuery = null;
    // Remove the last error message
    const msgs = document.getElementById('messages');
    const lastMsg = msgs.querySelector('.msg:last-child');
    if (lastMsg && lastMsg.classList.contains('bot')) lastMsg.remove();
    document.getElementById('queryInput').value = q;
    sendMessage();
  }

    document.getElementById('typing').style.display = 'flex';

        return;
      }

      let html = '<div class="disease-name">⚖ 疾病对比</div>';
      for (const key of ['disease1', 'disease2']) {
        const d = data[key];
        if (!d || !d.found) continue;
        const label = key === 'disease1' ? '🅰' : '🅱';
        html += `<hr class="divider"><div style="margin-bottom:6px;"><strong style="color:#60a5fa;">${label} ${escapeHtml(d.name)}</strong>`;

        if (d.symptom && d.symptom.length) html += `<span class="field-label">🤒 症状：</span>${escapeHtml(d.symptom.join('、'))}<br>`;
        if (d.cause) html += `<span class="field-label">🔬 病因：</span>${escapeHtml(d.cause)}<br>`;
        if (d.cure_department && d.cure_department.length) html += `<span class="field-label">🏥 科室：</span>${escapeHtml(d.cure_department.join('、'))}<br>`;

        html += `<hr class="divider"><div class="field-label">🔗 共同症状：</div>${escapeHtml(data.common_symptoms.join('、'))}<br>`;

        html += `<div class="field-label">🏥 共同就诊科室：</div>${escapeHtml(data.common_departments.join('、'))}<br>`;

      html += '<div style="margin-top:12px;font-size:11px;color:#64748b;">⚠ 以上信息来自医学知识库，仅供参考，具体诊断请就医。</div>';

        const resp = await fetch('/api/sim-response', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: query,
            session_id: getSessionId(),
            patient: {
              name: simPatient.name,
              age: simPatient.age,
              sex: simPatient.sex,
              dept: simPatient.dept,
              scenario: simPatient.scenario,
              stage: simStage
            }
          })
        });
        const data = await resp.json();

        document.getElementById('typing').style.display = 'none';

        // 更新阶段
        if (data.stage > simStage) {
          simStage = data.stage;
        }

        const stageTag = simStage > 0 ? `<span style="font-size:11px;color:#ffffff;">📍 ${getStageName(simStage)}阶段</span>` : '';
        addMessage('bot',
          `<div style="margin-bottom:4px;"><strong style="color:#60a5fa;">${simPatient.name}</strong> ${stageTag}</div>${data.reply}`,
          true);

        // 朗读患者回复（去除括号内的动作描述），使用患者专属音色
        const speakText = data.reply.replace(/（[^）]*）/, '').trim();
        VoiceController.speak(speakText, simPatient.voice || 'consultation');
      } catch (err) {
        document.getElementById('typing').style.display = 'none';
        addMessage('bot',
          `<div style="margin-bottom:4px;"><strong style="color:#60a5fa;">${simPatient.name}</strong></div>（${simPatient.name}看着你，等你说下一步该怎么办）`,
          true);
      }

      document.getElementById('sendBtn').disabled = false;
      input.placeholder = `作为陪诊师，请继续引导${simPatient.name}...`;
      input.focus();
      return;
    }

    // 检测是否触发了模拟请求
    if (/陪诊模拟|开始模拟|模拟训练|模拟陪诊|陪诊练习|陪诊训练|需要陪诊|进行一次陪诊|帮我模拟|生成.*患者/.test(query)) {
      addMessage('user', query);
      input.value = '';
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('typing').style.display = 'flex';

      await new Promise(r => setTimeout(r, 1000));
      document.getElementById('typing').style.display = 'none';

      simActive = true;
      simPatient = pickPatient();
      simStage = 1;  // 挂号阶段开始
      simPending = false;
      const welcome = buildWelcomeMsg(simPatient);
      addMessage('bot',
        '<div class="disease-name">🎭 陪诊模拟训练开始</div>' +
        `已为您随机生成一位模拟患者。请以<strong>陪诊师</strong>身份接待TA。<br><br>` + welcome,
        true);

      document.getElementById('sendBtn').disabled = false;
      input.placeholder = `您好${simPatient.name}，我是您的陪诊师...`;
      input.focus();
      return;
    }

    // 普通模式 → 使用流式回答
    addMessage('user', query);
    input.value = '';
    document.getElementById('sendBtn').disabled = true;
    renderSuggestions([]);

    await streamSearch(query);

    document.getElementById('sendBtn').disabled = false;
    input.focus();
    return;
  };
  // ========== Health tip of the day ==========
  async function loadHealthTip() {
    try {
      const resp = await fetch('/api/health-tips');
      const tip = await resp.json();
      if (tip && tip.title) {
        const statsBar = document.getElementById('stats');
        const existing = statsBar.querySelector('.health-tip-chip');
        if (!existing) {
          const chip = document.createElement('span');
          chip.className = 'health-tip-chip';
          chip.style.cssText = 'cursor:pointer;color:#fbbf24;display:flex;align-items:center;gap:4px;';
          chip.title = tip.content;
          chip.innerHTML = '💡 ' + escapeHtml(tip.title);
          chip.onclick = function() {
            const msgs = document.getElementById('messages');
            const welcome = msgs.querySelector('.welcome');
            if (welcome) welcome.remove();
            document.getElementById('homeBtn').classList.add('visible');
            addMessage('bot', '<div class="disease-name">💡 ' + escapeHtml(tip.title) + '</div>' + escapeHtml(tip.content), true);
          };
          statsBar.appendChild(chip);
        }
      }
    } catch(e) { /* ignore */ }
  }

  // Focus input on load
  document.getElementById('queryInput').focus();

  // ========== Input suggestions (disease name autocomplete) ==========
  let suggestTimer = null;
  let suggestBox = null;

  function createSuggestBox() {
    if (suggestBox) return;
    suggestBox = document.createElement('div');
    suggestBox.className = 'suggest-dropdown';
    suggestBox.style.cssText = 'display:none;position:absolute;z-index:100;background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);border-radius:8px;max-height:200px;overflow-y:auto;width:calc(100% - 48px);left:24px;bottom:80px;box-shadow:0 4px 24px rgba(0,0,0,.4);';
    document.querySelector('.input-area').appendChild(suggestBox);
  }

  document.getElementById('queryInput').addEventListener('input', function() {
    const val = this.value.trim();
    if (val.length < 2) {
      if (suggestBox) suggestBox.style.display = 'none';
      return;
    }
    clearTimeout(suggestTimer);
    suggestTimer = setTimeout(function() {
      fetch('/api/search-suggest?q=' + encodeURIComponent(val))
      .then(r => r.json())
      .then(data => {
        createSuggestBox();
        const suggestions = data.suggestions || [];
        if (!suggestions.length) { suggestBox.style.display = 'none'; return; }
        suggestBox.innerHTML = suggestions.slice(0, 6).map(function(d) {
          var safeN = d.name.replace(/'/g, "&#39;");
          return "<div class=\"suggest-item\" style=\"padding:8px 14px;cursor:pointer;font-size:14px;color:#e2e8f0;border-bottom:1px solid rgba(255,255,255,0.05);\" " +
            "onmousedown=\"setQueryAndSend('" + safeN + "');" +
            "var sb=document.querySelector('.suggest-dropdown');if(sb)sb.style.display='none';" +
            "document.getElementById('queryInput').focus();\">" +
            "<span style=\"color:#60a5fa;\">" + escapeHtml(d.name) + "</span>" +
            (d.desc ? "<br><span style=\"font-size:11px;color:#94a3b8;\">" + escapeHtml(d.desc.substring(0, 60)) + "</span>" : "") +
            "</div>";
        }).join('');        suggestBox.style.display = 'block';
      })
      .catch(function() { /* ignore */ });
    }, 250);
  });

  // Hide suggestions on blur
  document.getElementById('queryInput').addEventListener('blur', function() {
    setTimeout(function() { if (suggestBox) suggestBox.style.display = 'none'; }, 200);
  });

  // ========== Keyboard shortcuts ==========
  document.addEventListener('keydown', function(e) {
    // Ctrl+K / Alt+K → focus input
    if ((e.ctrlKey || e.altKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('queryInput').focus();
    }
    // Escape → stop speech + clear input focus
    if (e.key === 'Escape') {
      VoiceController.stop();
      document.getElementById('queryInput').blur();
      document.getElementById('queryInput').value = '';
    }
    // Ctrl+H → go home
    if (e.ctrlKey && e.key === 'h') {
      e.preventDefault();
      goHome();
    }
  });
</script>
