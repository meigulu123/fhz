<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陪优佳</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #1e293b;
    --primary: #60a5fa;
    --primary-light: rgba(96,165,250,0.15);
    --text: #f1f5f9;
    --text2: #ffffff;
    --border: rgba(255,255,255,0.12);
    --danger: #f87171;
    --warning: #fbbf24;
    --green: #34d399;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { background: #000; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
    background: transparent;
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 0;
  }
  /* Video background */
  .bg-video-wrap {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
  }
  .bg-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Header */
  .header {
    position: relative;
    z-index: 10;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }
  .logo-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .logo-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .stats-bar {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--text2);
  }
  .home-btn {
    display: none;
    align-items: center;
    gap: 4px;
    background: rgba(15, 23, 42, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    color: #cbd5e1;
    cursor: pointer;
    transition: all .15s;
    backdrop-filter: blur(12px);
  }
  .home-btn:hover {
    background: rgba(96, 165, 250, 0.4);
    color: #fff;
    border-color: rgba(96, 165, 250, 0.6);
  }
  .home-btn.visible { display: flex; }
  .stat-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }
  .stat-dot.green { background: var(--green); }

  /* Main layout */
  .main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    overflow: hidden;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }

  /* Chat area - full width */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Message bubbles */
  .msg {
    display: flex;
    gap: 12px;
    max-width: 90%;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .msg.bot .msg-avatar {
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    color: #fff;
  }
  .msg.user .msg-avatar {
    background: rgba(15, 23, 42, 0.5);
    color: #ffffff;
  }
  .msg-content {
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
    line-height: 1.65;
    font-size: 14px;
    backdrop-filter: blur(12px);
    color: #f1f5f9;
  }
  .msg.user .msg-content {
    background: rgba(96, 165, 250, 0.45);
    backdrop-filter: blur(12px);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .msg.bot .msg-content {
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Disease card styles */
  .msg.bot .msg-content .disease-name {
    font-size: 20px;
    font-weight: 700;
    color: #60a5fa;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .msg.bot .msg-content .field-label {
    font-weight: 600;
    color: #cbd5e1;
  }
  .msg.bot .msg-content .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }

  /* Typing indicator */
  .typing {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    color: #ffffff;
    font-size: 14px;
  }
  .typing .dots span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #94a3b8;
    margin: 0 2px;
    animation: bounce 1.4s infinite;
  }
  .typing .dots span:nth-child(2) { animation-delay: .2s; }
  .typing .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  /* Input area */
  .input-area {
    border-top: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(6px);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    padding: 4px 4px 4px 20px;
    transition: border-color .2s;
  }
  .input-wrap:focus-within {
    border-color: var(--primary);
    background: rgba(15, 23, 42, 0.6);
  }
  .input-wrap input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    padding: 10px 0;
    color: #f1f5f9;
  }
  .input-wrap input::placeholder { color: #ffffff; }
  .send-btn {
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #1d4ed8; transform: scale(1.05); }
  .send-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

  .quick-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 24px 8px;
  }
  .quick-btn {
    font-size: 12px;
    padding: 6px 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(12px);
    color: #cbd5e1;
    cursor: pointer;
    transition: all .15s;
  }
  .quick-btn:hover {
    background: rgba(96, 165, 250, 0.5);
    color: #fff;
    border-color: rgba(96, 165, 250, 0.6);
  }

  /* Welcome message */
  .welcome {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }
  .welcome h1 {
    font-size: 28px;
    color: var(--text);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .welcome-logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    object-fit: cover;
  }
  .welcome .mascot-wrap {
    display: inline-block;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 6px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .welcome .mascot {
    width: 200px;
    height: auto;
    border-radius: 12px;
    display: block;
    object-fit: cover;
  }
  .welcome .mascot-wrap video.mascot {
    width: 260px;
    height: 200px;
    object-fit: cover;
  }
  .welcome p {
    font-size: 15px;
    margin-bottom: 24px;
  }
  .welcome-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
    gap: 12px;
    max-width: 700px;
    margin: 0 auto;
  }
  .welcome-card {
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius);
    padding: 16px;
    text-align: left;
    cursor: pointer;
    transition: all .15s;
    font-size: 14px;
    color: #e2e8f0;
  }
  .welcome-card:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow);
  }
  .welcome-card .icon { font-size: 24px; margin-bottom: 8px; }

  /* Scrollbar */
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
  }
  .messages::-webkit-scrollbar-track {
    background: transparent;
  }

  /* ============ VITS TTS 离线语音 & 吉祥物动画 ============ */
  .mascot-wrap {
    position: relative;
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }
  .mascot-wrap.speaking {
    animation: mascotSpeakPulse 0.5s ease-in-out infinite alternate;
  }
  @keyframes mascotSpeakPulse {
    0%   { box-shadow: 0 0 15px rgba(96,165,250,0.4), 0 0 40px rgba(96,165,250,0.15); }
    100% { box-shadow: 0 0 35px rgba(96,165,250,0.8), 0 0 90px rgba(124,140,248,0.4); }
  }
  .speak-bars {
    display: none; justify-content: center; gap: 3px; margin-top: 4px;
    height: 20px; align-items: flex-end;
  }
  .mascot-wrap.speaking .speak-bars { display: flex; }
  .speak-bars span {
    display: inline-block; width: 4px; border-radius: 2px;
    background: var(--primary);
    animation: speakBarBounce 0.45s ease-in-out infinite alternate;
  }
  .speak-bars span:nth-child(1) { height: 8px;  animation-delay: 0s; }
  .speak-bars span:nth-child(2) { height: 16px; animation-delay: 0.1s; }
  .speak-bars span:nth-child(3) { height: 10px; animation-delay: 0.2s; }
  .speak-bars span:nth-child(4) { height: 18px; animation-delay: 0.3s; }
  .speak-bars span:nth-child(5) { height: 7px;  animation-delay: 0.4s; }
  @keyframes speakBarBounce {
    0%   { transform: scaleY(0.4); opacity: 0.5; }
    100% { transform: scaleY(1.1); opacity: 1; }
  }
  /* TTS 状态指示器 */
  #ttsStatus {
    display: none; text-align: center; padding: 6px; font-size: 12px;
    color: #94a3b8; background: rgba(15,23,42,0.5);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #ttsStatus.visible { display: block; }
  #ttsStatus.error { color: var(--danger); }
  #ttsStatus .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid rgba(96,165,250,0.3); border-top-color: var(--primary);
    border-radius: 50%; animation: ttsSpin 0.8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes ttsSpin { to { transform: rotate(360deg); } }

  /* 音频降级按钮 */
  .audio-fallback-btn {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 1000; padding: 16px 32px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    border: 2px solid rgba(255,255,255,0.3); border-radius: 40px;
    color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; box-shadow: 0 8px 32px rgba(96,165,250,0.5);
    animation: fallbackPulse 2s ease-in-out infinite;
    backdrop-filter: blur(12px); white-space: nowrap;
  }
  .audio-fallback-btn.hidden { display: none; }
  @keyframes fallbackPulse {
    0%,100% { box-shadow: 0 8px 32px rgba(96,165,250,0.5); }
    50%     { box-shadow: 0 8px 48px rgba(124,140,248,0.8); transform: translate(-50%,-50%) scale(1.04); }
  }

  /* ============ 播放控制栏 ============ */
  .playback-controls {
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    display: flex; gap: 6px;
    background: rgba(15,23,42,0.55); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px; padding: 5px 10px;
    box-shadow: var(--shadow);
  }
  .pb-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: transparent; color: #cbd5e1;
    font-size: 16px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .pb-btn:hover { background: rgba(96,165,250,0.35); color: #fff; }
  .pb-btn.active { background: var(--primary); color: #fff; }
  .pb-btn.muted { color: var(--danger); }
  .pb-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* 语音ASR收音指示条 */
  .listening-bar {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; z-index: 2000;
    height: 3px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f87171, #60a5fa);
    background-size: 300% 100%;
    animation: listeningSlide 2s linear infinite;
  }
  @keyframes listeningSlide {
    from { background-position: 300% 0; }
    to   { background-position: 0 0; }
  }
  #queryInput.interim { color: #94a3b8; font-style: italic; }

  /* 麦克风按钮 */
  .mic-btn {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(15,23,42,0.4); backdrop-filter: blur(12px);
    color: #fff; font-size: 20px; cursor: pointer; transition: all 0.2s;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .mic-btn:hover { background: rgba(96,165,250,0.4); }
  .mic-btn.listening {
    background: #ef4444; color: #fff;
    animation: micPulse 1.5s ease-in-out infinite;
  }
  .mic-btn.denied { opacity: 0.3; cursor: not-allowed; }
  @keyframes micPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
    50%     { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
  }

  /* 吉祥物嘴部动效 */
  .voice-mouth {
    display: none;
    position: absolute;
    bottom: 14%;
    left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 6px;
    border-radius: 0 0 15px 15px;
    background: rgba(96,165,250,0.7);
    box-shadow: 0 0 10px rgba(96,165,250,0.5);
    z-index: 5; pointer-events: none;
  }
  .mascot-wrap.speaking .voice-mouth {
    display: block;
    animation: mouthTalk 0.25s ease-in-out infinite alternate;
  }
  @keyframes mouthTalk {
    0%   { height: 6px;  border-radius: 0 0 10px 10px; opacity: 0.5; transform: translateX(-50%) scaleY(0.6); }
    50%  { height: 16px; border-radius: 0 0 20px 20px; opacity: 1;   transform: translateX(-50%) scaleY(1.2); }
    100% { height: 8px;  border-radius: 0 0 12px 12px; opacity: 0.7; transform: translateX(-50%) scaleY(0.8); }
  }
  .mascot-wrap.paused .voice-mouth {
    display: block;
    height: 8px; opacity: 0.5;
    animation: none;
  }
  /* 场景：欢迎语缓慢温暖 */
  .mascot-wrap.scenario-welcome .voice-mouth {
    animation-duration: 0.4s;
    background: rgba(167,139,250,0.7);
  }
  /* 场景：AI回答清晰快速 */
  .mascot-wrap.scenario-answer .voice-mouth {
    animation-duration: 0.2s;
  }

  @media (max-width: 500px) {
    .voice-mouth { width: 20px; }
    @keyframes mouthTalk {
      0%   { height: 4px;  }
      50%  { height: 10px; }
      100% { height: 5px;  }
    }
  }

  /* ============ Copy button on messages ============ */
  .msg .copy-btn {
    display: none;
    position: absolute; top: 6px; right: 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: #94a3b8; font-size: 11px; cursor: pointer;
    padding: 2px 8px; transition: all .15s;
  }
  .msg .msg-content { position: relative; }
  .msg:hover .copy-btn { display: inline-block; }
  .msg .copy-btn:hover { background: rgba(96,165,250,0.3); color: #fff; }
  .msg .copy-btn.copied { background: var(--green); color: #fff; }

  /* Timestamp */
  .msg .msg-time {
    font-size: 10px; color: #64748b; margin-top: 4px;
    display: block;
  }

  /* Follow-up suggestions */
  .suggestions-wrap {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 8px 24px 4px;
  }
  .suggestions-wrap .suggest-chip {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid rgba(96,165,250,0.3);
    border-radius: 16px;
    background: rgba(96,165,250,0.1);
    color: #60a5fa;
    cursor: pointer;
    transition: all .15s;
    backdrop-filter: blur(12px);
  }
  .suggestions-wrap .suggest-chip:hover {
    background: rgba(96,165,250,0.3);
    border-color: var(--primary);
    color: #fff;
  }

  /* Feedback buttons */
  .msg .feedback-row {
    display: none; gap: 6px; margin-top: 6px; font-size: 12px;
  }
  .msg:hover .feedback-row { display: flex; }
  .feedback-row .fb-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px; color: #94a3b8; cursor: pointer;
    padding: 2px 6px; font-size: 11px; transition: all .15s;
  }
  .feedback-row .fb-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .feedback-row .fb-btn.active.good { color: #34d399; border-color: #34d399; }
  .feedback-row .fb-btn.active.bad { color: #f87171; border-color: #f87171; }

  /* Responsive */
  @media (max-width: 768px) {
    .msg { max-width: 95%; }
    .welcome-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- Video background -->
<div class="bg-video-wrap">
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="/static/bg-video.mp4" type="video/mp4">
  </video>
</div>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-icon"><img src="/static/logo.jpg" alt="Logo"></div>
    <span>陪优佳</span>
  </div>
  <button class="home-btn" id="homeBtn" onclick="goHome()" title="回到主页">🏠 主页</button>
  <button class="home-btn" id="exportBtn" onclick="exportConversation()" title="导出对话" style="margin-left:6px;">📥 导出</button>
  <div class="stats-bar" id="stats">
    <span><span class="stat-dot green"></span>加载中...</span>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="welcome">
        <div class="mascot-wrap" id="mascotWrap"><video class="mascot" id="mascotVideo" src="/static/mascot-video.mp4" autoplay muted loop playsinline></video><div class="voice-mouth" id="voiceMouth"></div><div class="speak-bars" id="speakBars"><span></span><span></span><span></span><span></span><span></span></div></div>
        <h1><img src="/static/logo.jpg" class="welcome-logo" alt="Logo"> 陪优佳</h1>
        <p>智慧陪诊助手，模拟家人陪同就诊，用对话解答就医疑问</p>
        <p style="font-size:12px;color:#94a3b8;margin-top:-16px;">
          💡 试试输入：<span style="color:#60a5fa;cursor:pointer;" onclick="document.getElementById('queryInput').value='糖尿病饮食注意什么';document.getElementById('queryInput').focus();">"糖尿病饮食注意什么"</span> 或
          <span style="color:#60a5fa;cursor:pointer;" onclick="document.getElementById('queryInput').value='头痛挂什么科';document.getElementById('queryInput').focus();">"头痛挂什么科"</span>
        </p>
        <div class="welcome-grid">
          <div class="welcome-card" onclick="enterSimMode()">
            <div class="icon">👵</div>
            <strong>陪诊模拟</strong>
            <p style="color:#ffffff;font-size:12px;">扮演陪诊师，AI生成模拟患者供您练习</p>

<script>
// ============================================================
//  AudioUnlockManager — 浏览器音频自动播放策略解锁
//  机制：首次用户交互时静音预解锁 + localStorage 持久化
// ============================================================
const AudioUnlockManager = {
  STORAGE_KEY: 'peiyoujia_audio_unlocked',

  isUnlocked() {
    return localStorage.getItem(this.STORAGE_KEY) === '1';
  },

  setUnlocked() {
    localStorage.setItem(this.STORAGE_KEY, '1');
  },

  /** 在用户手势中执行：创建静音 AudioContext 并立即播放零采样，解锁音频权限 */
  prime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      // 播放 1ms 静音缓冲区，触发浏览器放行
      const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start(0);
      src.onended = () => { ctx.close().catch(()=>{}); };
    } catch(e) { /* 静音预解锁失败不阻塞 */ }
  }
};

// ============================================================
//  BrowserSpeechEngine — 浏览器内置语音合成（零依赖，国内可用）
//  作为 VITS 离线引擎的可靠降级方案
// ============================================================
class BrowserSpeechEngine {
  constructor() {
    this.ready = true;
    this._state = 'idle';    // 'idle' | 'playing' | 'paused'
    this._muted = false;
    this._voice = null;
    this._utterance = null;
    this._warmedUp = false;
    this.error = null;
    this._loadVoices();
  }

  _loadVoices() {
    const setVoice = () => {
      const voices = speechSynthesis.getVoices();
      if (!voices.length) return;
      // 优先选择温暖亲切的中文女声（匹配阿里云思琪/豆包风格）
      // 优先级：Xiaoxiao(微软最暖) > Yaoyao(年轻) > Huihui(标准) > 任意本地zh-CN女声
      const tier1 = ['Xiaoxiao', 'xiaoxiao'];           // Win11 最温暖女声
      const tier2 = ['Yaoyao', 'yaoyao', 'YaoYao'];     // 年轻温暖女声
      const tier3 = ['Huihui', 'huihui', 'HuiHui'];     // 标准女声
      let best = null;
      for (const names of [tier1, tier2, tier3]) {
        for (const v of voices) {
          if (v.lang.startsWith('zh-CN') && names.some(n => v.name.includes(n))) {
            best = v; break;
          }
        }
        if (best) break;
      }
      // 退而求其次：本地 zh-CN 女声
      if (!best) {
        best = voices.find(v => v.lang === 'zh-CN' && v.localService && /female|nv|nvSheng|woman/i.test(v.name)) ||
                voices.find(v => v.lang === 'zh-CN' && v.localService) ||
                voices.find(v => v.lang.startsWith('zh-CN')) ||
                voices.find(v => v.lang.startsWith('zh'));
      }
      this._voice = best;
      if (best) console.log('[BrowserSpeech] 选择语音:', best.name, best.lang);
    };
    setVoice();
    speechSynthesis.onvoiceschanged = setVoice;
  }

  async init() {
    this.ready = true;
    // 预热：在静默状态下触发一次（解决某些浏览器首次调用延迟）
    if (speechSynthesis.speaking) speechSynthesis.cancel();
  }

  speak(text, options = {}) {
    if (this._muted || !this.ready) return;
    if (!window.speechSynthesis) return;

    this.stop();

    const { onStart, onEnd, speed = 1.0, pitch = 1.0 } = options;
    const cleanText = this._cleanText(text);
    if (!cleanText) return;

    const doSpeak = () => {
      // 预热：某些浏览器首次 speak 静默，先发一个空 utterance
      if (!this._warmedUp) {
        try {
          const warm = new SpeechSynthesisUtterance('');
          warm.volume = 0;
          warm.rate = 10;
          speechSynthesis.speak(warm);
          this._warmedUp = true;
        } catch(_) {}
      }

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'zh-CN';
      utterance.rate = speed;
      utterance.pitch = pitch;
      utterance.volume = 1;

      if (this._voice) utterance.voice = this._voice;

      utterance.onstart = () => {
        this._state = 'playing';
        this._setMascotSpeaking(true);
        if (onStart) onStart();
      };
      utterance.onend = () => {
        this._state = 'idle';
        this._setMascotSpeaking(false);
        if (onEnd) onEnd();
      };
      utterance.onerror = (e) => {
        if (e.error !== 'canceled' && e.error !== 'interrupted') {
          console.warn('[BrowserSpeech] 播放出错:', e.error);
        }
        this._state = 'idle';
        this._setMascotSpeaking(false);
        if (onEnd) onEnd();
      };

      this._utterance = utterance;
      speechSynthesis.speak(utterance);
    };

    // Chrome 修复：cancel() 后延迟 100ms 再 speak，避免静默丢弃
    setTimeout(doSpeak, 100);
  }

  speakHtml(html, options = {}) {
    const div = document.createElement('div');
    div.innerHTML = html;
    const plain = (div.textContent || '').trim();
    if (plain) this.speak(plain, options);
  }

  stop() {
    if (window.speechSynthesis) {
      speechSynthesis.cancel();
    }
    this._state = 'idle';
    this._setMascotSpeaking(false);
  }

  pause() {
    if (!window.speechSynthesis || this._state !== 'playing') return;
    try {
      speechSynthesis.pause();
      this._state = 'paused';
      const wrap = document.getElementById('mascotWrap');
      if (wrap) { wrap.classList.remove('speaking'); wrap.classList.add('paused'); }
    } catch(e) {
      console.warn('[BrowserSpeech] pause failed:', e);
    }
  }

  resume() {
    if (!window.speechSynthesis || this._state !== 'paused') return;
    try {
      speechSynthesis.resume();
      this._state = 'playing';
      const wrap = document.getElementById('mascotWrap');
      if (wrap) { wrap.classList.remove('paused'); wrap.classList.add('speaking'); }
    } catch(e) {
      console.warn('[BrowserSpeech] resume failed:', e);
    }
  }

  _cleanText(text) {
    return text
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  _setMascotSpeaking(active) {
    const wrap = document.getElementById('mascotWrap');
    if (!wrap) return;
    active ? wrap.classList.add('speaking') : wrap.classList.remove('speaking');
  }

  setMuted(muted) {
    this._muted = muted;
    if (muted) this.stop();
    const btn = document.getElementById('pbMute');
    if (btn) {
      btn.textContent = muted ? '🔇' : '🔊';
      muted ? btn.classList.add('muted') : btn.classList.remove('muted');
    }
  }

  toggleMute() { this.setMuted(!this._muted); }

  ensureAudioContext() { return 'running'; }
  _hideFallbackBtn() {
    const btn = document.getElementById('audioFallbackBtn');
    if (btn) btn.classList.add('hidden');
  }
  _showFallbackBtn() {
    const btn = document.getElementById('audioFallbackBtn');
    if (btn) btn.classList.remove('hidden');
  }

  get isReady()   { return this.ready; }
  get isSpeaking(){ return this._state === 'playing'; }
  get isPaused()  { return this._state === 'paused'; }
  get isIdle()    { return this._state === 'idle'; }
  get isMuted()   { return this._muted; }
  get state()     { return this._state; }
}

// ============================================================
//  SpeechRecognitionEngine — 浏览器语音识别（ASR）
//  封装 webkitSpeechRecognition，支持中英文
// ============================================================
class SpeechRecognitionEngine {
  constructor() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    this.isSupported = !!SR;
    if (!this.isSupported) return;
    this._SR = SR;
    this._recognition = null;
    this._listening = false;
    this._callbacks = {
      onResult: null,   // final transcript
      onInterim: null,  // interim transcript
      onError: null,    // {type, message}
      onStateChange: null
    };
  }

  start(options = {}) {
    if (!this.isSupported || this._listening) return;
    this.abort(); // clean up any stale instance

    const rec = new this._SR();
    rec.lang = options.lang || 'zh-CN';
    rec.continuous = options.continuous !== undefined ? options.continuous : false;
    rec.interimResults = options.interimResults !== undefined ? options.interimResults : true;
    rec.maxAlternatives = 1;

    rec.onstart = () => {
      this._listening = true;
      if (this._callbacks.onStateChange) this._callbacks.onStateChange(true);
    };

    rec.onresult = (event) => {
      let interim = '';
      let final = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          final += transcript;
        } else {
          interim += transcript;
        }
      }
      if (this._callbacks.onInterim && interim) this._callbacks.onInterim(interim);
      if (this._callbacks.onResult && final) this._callbacks.onResult(final);
    };

    rec.onspeechend = () => {
      // silence detected → auto-stop, fires onend
      rec.stop();
    };

    rec.onerror = (event) => {
      const err = this._classifyError(event.error);
      if (this._callbacks.onError && err.type !== 'aborted') {
        this._callbacks.onError(err);
      }
    };

    rec.onend = () => {
      this._listening = false;
      if (this._callbacks.onStateChange) this._callbacks.onStateChange(false);
    };

    this._recognition = rec;
    rec.start();
  }

  stop() {
    if (this._recognition && this._listening) {
      this._recognition.stop();
    }
  }

  abort() {
    if (this._recognition) {
      try { this._recognition.abort(); } catch(e) {}
    }
    this._listening = false;
  }

  _classifyError(error) {
    switch (error) {
      case 'not-allowed':    return {type:'permission', msg:'请在浏览器设置中允许麦克风权限'};
      case 'audio-capture':  return {type:'no-device', msg:'未检测到麦克风设备'};
      case 'no-speech':      return {type:'no-input',  msg:'未检测到语音，请重试'};
      case 'network':        return {type:'network',   msg:'语音识别服务暂不可用'};
      case 'aborted':        return {type:'aborted',   msg:''};
      default:               return {type:'unknown',   msg:'语音识别出错: ' + error};
    }
  }

  get isListening() { return this._listening; }
}

// ============================================================
//  VitsOfflineTTSEngine — 基于 onnxruntime-web + vits_zh_mini.onnx
//  纯离线推理，不依赖云端 API
// ============================================================
class VitsOfflineTTSEngine {
  constructor(options = {}) {
    this.modelPath  = options.modelPath  || '/static/tts-model/vits_zh_mini.onnx';
    this.vocabPath  = options.vocabPath  || '/static/tts-model/vocab.txt';
    this.configPath = options.configPath || '/static/tts-model/config.json';
    this.lexiconPath= options.lexiconPath|| '/static/tts-model/lexicon.txt';
    this.spkPath    = options.spkPath    || '/static/tts-model/spk_embed.bin';
    this.ortUrl     = options.ortUrl     || '/static/js/ort.all.min.js';
    this.wasmPaths  = options.wasmPaths  || '/static/js/';

    this.session = null;      // ort.InferenceSession
    this.vocab = null;        // Map<token, id>  — phoneme→ID
    this.charToPinyin = null; // Map<character, pinyin-string>  — 中文→拼音
    this.config = null;       // { sample_rate, noise_scale, length_scale, noise_scale_w }
    this.spkEmbed = null;     // Float32Array | null
    this.ready = false;
    this.loading = false;
    this.error = null;
    this.audioCtx = null;
    this._speaking = false;
    this._muted = false;
    this._gainNode = null;
  }

  // ==================== 资源加载 ====================

  async init() {
    if (this.loading || this.ready) return;
    this.loading = true;
    this._setStatus('loading', '离线语音引擎加载中...');

    try {
      // 1) 预校验本地模型文件是否存在
      await this._checkFiles();

      // 2) 加载 onnxruntime-web
      await this._loadOrtScript();

      // 3) 并行加载模型 / 词表 / 配置 / 词典（带 IndexedDB 缓存）
      const [modelBuf, vocabText, configJson, lexiconText] = await Promise.all([
        this._loadCached(this.modelPath,  'vits_model'),
        this._loadCachedText(this.vocabPath, 'vocab'),
        this._loadCachedText(this.configPath, 'config'),
        this._loadCachedText(this.lexiconPath, 'lexicon').catch(() => null)
      ]);

      // 4) 创建推理会话
      this.session = await ort.InferenceSession.create(modelBuf);

      // 5) 解析词表（tokens.txt → ID 映射）
      this._parseVocab(vocabText);

      // 6) 解析配置
      this.config = JSON.parse(configJson);

      // 7) 解析拼音词典（lexicon.txt → char→pinyin 映射）
      if (lexiconText) this._parseLexicon(lexiconText);

      // 8) 尝试加载说话人向量（可选）
      try {
        const spkBuf = await this._loadCached(this.spkPath, 'spk_embed');
        this.spkEmbed = new Float32Array(spkBuf);
      } catch(e) {
        // 模型可能不需要说话人向量
        console.log('[VitsTTS] 无说话人向量，使用默认（单说话人模型）');
        this.spkEmbed = null;
      }

      this.ready = true;
      this.error = null;
      this._setStatus('ready', '');
      console.log('[VitsTTS] ✅ 模型加载完成 —', this.config.sample_rate + 'Hz',
        '| 词表:', this.vocab.size, '| 词典:', this.charToPinyin ? this.charToPinyin.size : 0);
    } catch (err) {
      this.ready = false;
      this.error = err.message || String(err);
      this._setStatus('error', '⚠ ' + this.error);
      console.warn('[VitsTTS] ❌ 初始化失败:', this.error);
      throw err;  // 向上抛出，方便 UI 层降级处理
    } finally {
      this.loading = false;
    }
  }

  /** 预校验：HEAD 请求确认核心文件存在（spk_embed 可选） */
  async _checkFiles() {
    const required = [this.modelPath, this.vocabPath, this.configPath, this.lexiconPath];
    const results = await Promise.allSettled(required.map(f => fetch(f, { method: 'HEAD' })));
    const missing = [];
    results.forEach((r, i) => {
      if (r.status === 'rejected' || !r.value.ok) {
        missing.push(required[i].split('/').pop());
      }
    });
    if (missing.length) {
      throw new Error('缺少模型文件: ' + missing.join(', ') + ' ，请下载完整语音数据库到 static/tts-model/');
    }
  }

  /** 加载 onnxruntime-web 本地脚本 + 配置 WASM 路径 */
  async _loadOrtScript() {
    if (typeof ort !== 'undefined') return;
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = this.ortUrl;
      script.onload = () => {
        console.log('[VitsTTS] onnxruntime-web 本地加载完成');
        // 配置 WASM 文件路径（本地）
        try {
          ort.env.wasm.wasmPaths = this.wasmPaths;
          ort.env.wasm.numThreads = 1;
        } catch(e) {
          console.warn('[VitsTTS] WASM 路径配置失败:', e);
        }
        setTimeout(resolve, 300);
      };
      script.onerror = () => reject(new Error('无法加载 onnxruntime-web 本地文件，请检查 static/js/ 目录'));
      document.head.appendChild(script);
    });
  }

  /** fetch → ArrayBuffer，带 IndexedDB 缓存 */
  async _loadCached(url, cacheKey) {
    // 尝试从 IndexedDB 读取
    try {
      const cached = await this._readDB(cacheKey);
      if (cached) { console.log('[VitsTTS] 📦 命中缓存:', cacheKey); return cached; }
    } catch(e) { /* DB 不可用则跳过 */ }

    // 网络请求
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${url}`);
    const buf = await resp.arrayBuffer();

    // 写入 IndexedDB
    try { await this._writeDB(cacheKey, buf); } catch(e) {}

    return buf;
  }

  /** fetch → text，带 IndexedDB 缓存 */
  async _loadCachedText(url, cacheKey) {
    const cached = await this._readDB(cacheKey);
    if (cached) {
      const decoder = new TextDecoder();
      return decoder.decode(cached);
    }
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${url}`);
    const text = await resp.text();
    const encoder = new TextEncoder();
    try { await this._writeDB(cacheKey, encoder.encode(text).buffer); } catch(e) {}
    return text;
  }

  /** 解析 tokens.txt → Map<phoneme, id>
   *  格式: "sil 0" / "eos 1" / "sp 2" / "#0 3" / "^ 5" / "i1 6"
   *  每行: <token> <id>
   */
  _parseVocab(text) {
    this.vocab = new Map();
    const lines = text.split('\n');
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      // 格式: "token id" 或 "token\tid"
      const parts = line.split(/\s+/);
      if (parts.length >= 2) {
        const token = parts[0];
        const id = parseInt(parts[1], 10);
        if (!isNaN(id) && !this.vocab.has(token)) {
          this.vocab.set(token, id);
        }
      } else if (parts.length === 1) {
        // 纯 token，用行号
        if (!this.vocab.has(parts[0])) this.vocab.set(parts[0], i);
      }
    }
    console.log('[VitsTTS] 音素词表加载:', this.vocab.size, '个 token');
  }

  /** 解析 lexicon.txt → Map<Chinese-char, pinyin-tokens>
   *  格式: "一 ^ i1 #0" / "丁 d ing1 #0"
   *  每行: <汉字> <拼音音素...>
   */
  _parseLexicon(text) {
    this.charToPinyin = new Map();
    const lines = text.split('\n');
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      const parts = trimmed.split(/\s+/);
      if (parts.length >= 2) {
        const char = parts[0];
        const pinyinTokens = parts.slice(1);  // 空格分隔的音素列表
        if (char && pinyinTokens.length > 0) {
          this.charToPinyin.set(char, pinyinTokens);
        }
      }
    }
    console.log('[VitsTTS] 拼音词典加载:', this.charToPinyin.size, '个汉字');
  }

  // ==================== IndexedDB ====================
  _openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('peiyoujia-tts-cache', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('models'); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async _readDB(key) {
    const db = await this._openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('models', 'readonly');
      const req = tx.objectStore('models').get(key);
      req.onsuccess = () => { db.close(); resolve(req.result || null); };
      req.onerror = () => { db.close(); reject(req.error); };
    });
  }

  async _writeDB(key, buffer) {
    const db = await this._openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('models', 'readwrite');
      tx.objectStore('models').put(buffer, key);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  }

  // ==================== 文本处理 ====================

  _cleanText(text) {
    return text
      .replace(/[（(][^）)]*[）)]/g, '')  // 去括号注释
      .replace(/[^一-鿿㐀-䶿a-zA-Z0-9，。！？、；：""''…—\s]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  _tokenize(text) {
    const clean = this._cleanText(text);
    if (!clean) return [];

    const ids = [];
    const chars = [...clean];

    if (this.charToPinyin && this.charToPinyin.size > 0) {
      // Pinyin-based tokenization (vits-aishell3)
      for (const ch of chars) {
        if (this.charToPinyin.has(ch)) {
          const pinyinTokens = this.charToPinyin.get(ch);
          for (const pt of pinyinTokens) {
            if (this.vocab.has(pt)) {
              ids.push(BigInt(this.vocab.get(pt)));
            } else {
              ids.push(BigInt(0)); // unknown phoneme → <sil>
            }
          }
        } else if (/[一-鿿]/.test(ch)) {
          // Chinese character not in lexicon → skip
          console.warn('[VitsTTS] 未收录汉字:', ch);
        } else if (/[a-zA-Z0-9]/.test(ch)) {
          // ASCII letter/digit → keep as-is if in vocab
          if (this.vocab.has(ch)) ids.push(BigInt(this.vocab.get(ch)));
        }
        // Punctuation/spaces are silently dropped
      }
    } else {
      // Fallback: direct character lookup (for non-pinyin models)
      for (const ch of chars) {
        if (this.vocab.has(ch)) {
          ids.push(BigInt(this.vocab.get(ch)));
        } else if (/[一-鿿]/.test(ch)) {
          console.warn('[VitsTTS] 未收录汉字:', ch);
          ids.push(BigInt(0));
        }
      }
    }

    return ids;
  }

  // ==================== 推理 + 播放 ====================

  async _inference(tokenIds) {
    if (!this.session) throw new Error('模型未加载');

    const feeds = {};
    const inputNames = this.session.inputNames;

    // 根据模型输入名动态构造 feed
    if (inputNames.includes('input')) {
      feeds.input = new ort.Tensor('int64', BigInt64Array.from(tokenIds), [1, tokenIds.length]);
    } else {
      // 兼容其他命名
      const name = inputNames[0];
      feeds[name] = new ort.Tensor('int64', BigInt64Array.from(tokenIds), [1, tokenIds.length]);
    }

    // 噪声参数
    const ns = this.config.noise_scale ?? 0.667;
    const ls = this.config.length_scale ?? 1.0;
    const nsw = this.config.noise_scale_w ?? 0.8;
    if (inputNames.includes('noise_scale'))  feeds.noise_scale  = new ort.Tensor('float32', [ns], [1]);
    if (inputNames.includes('length_scale')) feeds.length_scale = new ort.Tensor('float32', [ls], [1]);
    if (inputNames.includes('noise_scale_w')) feeds.noise_scale_w = new ort.Tensor('float32', [nsw], [1]);

    // 说话人向量（可选，单说话人模型可能不需要）
    if (this.spkEmbed) {
      if (inputNames.includes('g')) {
        feeds.g = new ort.Tensor('float32', this.spkEmbed, [1, this.spkEmbed.length]);
      } else if (inputNames.includes('sid')) {
        feeds.sid = new ort.Tensor('int64', [BigInt(0)], [1]);
      }
    }

    const results = await this.session.run(feeds);
    const outName = this.session.outputNames[0];
    const output = results[outName];

    return { samples: output.data, sampleRate: this.config.sample_rate || 22050 };
  }

  /** 公开 API：合成并播放 */
  async speak(text, options = {}) {
    if (!this.ready || !this.session) return;
    if (this._muted) return;

    const { onStart, onEnd, speed = 1.0 } = options;

    try {
      const tokenIds = this._tokenize(text);
      if (tokenIds.length === 0) {
        console.warn('[VitsTTS] tokenize 结果为空');
        return;
      }
      const { samples, sampleRate } = await this._inference(tokenIds);
      if (!samples || samples.length === 0) {
        console.warn('[VitsTTS] 推理结果为空');
        return;
      }
      await this._playAudio(samples, sampleRate, { onStart, onEnd, speed });
    } catch (err) {
      console.warn('[VitsTTS] speak 失败:', err.message);
      // 播放失败不抛异常，尝试降级到 NotAllowedError 处理
      if (err.name === 'NotAllowedError') {
        this._showFallbackBtn();
      }
    }
  }

  /** Web Audio API 播放 */
  async _playAudio(samples, sampleRate, { onStart, onEnd, speed }) {
    if (!this.audioCtx || this.audioCtx.state === 'closed') {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.audioCtx.state === 'suspended') {
      await this.audioCtx.resume();
    }
    if (this.audioCtx.state === 'suspended') {
      // AudioContext 被浏览器拦截 → 显示降级按钮
      this._showFallbackBtn();
      return;
    }

    const ctx = this.audioCtx;
    const len = Math.min(samples.length, 60 * sampleRate);  // 最长 60 秒
    const actualSamples = speed !== 1.0
      ? this._resample(samples.slice(0, len), sampleRate, sampleRate * speed)
      : samples.slice(0, len);

    const buffer = ctx.createBuffer(1, actualSamples.length, sampleRate);
    buffer.getChannelData(0).set(actualSamples);

    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.playbackRate.value = 1.0;

    // 静音控制
    if (!this._gainNode || this._gainNode.context !== ctx) {
      this._gainNode = ctx.createGain();
    }
    this._gainNode.gain.value = this._muted ? 0 : 1;
    source.connect(this._gainNode);
    this._gainNode.connect(ctx.destination);

    source.onended = () => {
      this._speaking = false;
      this._setMascotSpeaking(false);
      if (onEnd) onEnd();
    };

    this._speaking = true;
    source.start(0);
    this._setMascotSpeaking(true);
    if (onStart) onStart();
  }

  /** 简单线性重采样 */
  _resample(samples, srcRate, dstRate) {
    const ratio = srcRate / dstRate;
    const newLen = Math.floor(samples.length / ratio);
    const result = new Float32Array(newLen);
    for (let i = 0; i < newLen; i++) {
      const srcIdx = i * ratio;
      const floor = Math.floor(srcIdx);
      const frac = srcIdx - floor;
      const a = samples[floor] || 0;
      const b = samples[Math.min(floor + 1, samples.length - 1)] || 0;
      result[i] = a + (b - a) * frac;
    }
    return result;
  }

  /** 朗读 HTML 内容 */
  speakHtml(htmlContent, options = {}) {
    const div = document.createElement('div');
    div.innerHTML = htmlContent;
    const plain = (div.textContent || div.innerText || '').trim();
    if (plain) this.speak(plain, options);
  }

  /** 停止播放 */
  stop() {
    if (this.audioCtx && this.audioCtx.state !== 'closed') {
      this.audioCtx.close().catch(() => {});
      this.audioCtx = null;
      this._gainNode = null;
    }
    this._speaking = false;
    this._setMascotSpeaking(false);
  }

  /** 静音开关 */
  setMuted(muted) {
    this._muted = muted;
    if (this._gainNode) {
      this._gainNode.gain.value = muted ? 0 : 1;
    }
    const btn = document.getElementById('muteToggle');
    if (btn) {
      btn.textContent = muted ? '🔇' : '🔊';
      btn.classList.toggle('muted', muted);
    }
  }

  toggleMute() { this.setMuted(!this._muted); }

  /** 确保 AudioContext 在用户手势中创建/恢复 */
  ensureAudioContext() {
    if (!this.audioCtx || this.audioCtx.state === 'closed') {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.audioCtx.state === 'suspended') {
      this.audioCtx.resume();
    }
    return this.audioCtx.state;
  }

  /** 显示降级按钮 */
  _showFallbackBtn() {
    const btn = document.getElementById('audioFallbackBtn');
    if (btn) btn.classList.remove('hidden');
  }

  /** 隐藏降级按钮 */
  _hideFallbackBtn() {
    const btn = document.getElementById('audioFallbackBtn');
    if (btn) btn.classList.add('hidden');
  }

  /** 吉祥物动画 */
  _setMascotSpeaking(active) {
    const wrap = document.getElementById('mascotWrap');
    if (!wrap) return;
    active ? wrap.classList.add('speaking') : wrap.classList.remove('speaking');
  }

  /** TTS 状态指示器 */
  _setStatus(state, msg) {
    const el = document.getElementById('ttsStatus');
    if (!el) return;
    el.className = state === 'error' ? 'visible error' : (state === 'loading' ? 'visible' : '');
    el.innerHTML = state === 'loading' ? '<span class="spinner"></span>' + msg : msg;
  }

  get isReady()   { return this.ready; }
  get isSpeaking(){ return this._speaking; }
  get isMuted()   { return this._muted; }
}

// ============================================================
//  VoiceController — 统一语音调度中心
//  协调 TTS + ASR + 嘴部动画 + 播放控制 UI
// ============================================================
const VoiceController = {
  _engine: null,
  _asr: null,
  _state: 'idle',     // 'idle' | 'playing' | 'paused'
  _scenario: null,

  SCENARIOS: {
    welcome:      { speed: 0.82, pitch: 0.88 },  // 阿里云思琪风格：低音温柔
    consultation: { speed: 0.88, pitch: 0.90 },  // 自然对话，亲切不急
    answer:       { speed: 0.95, pitch: 0.92 }   // 清晰但保持柔和
  },

  init(engine) {
    this._engine = engine;
    this._asr = new SpeechRecognitionEngine();
    if (this._asr.isSupported) {
      this._asr._callbacks.onResult = (text) => this._handleASRResult(text);
      this._asr._callbacks.onInterim = (text) => this._handleASRInterim(text);
      this._asr._callbacks.onError = (err) => this._handleASRError(err);
    }
    this._syncPlaybackUI();
  },

  speak(text, scenarioOrProfile = 'answer') {
    if (!this._engine || !text) return;
    this.stop();
    // 支持两种调用方式：
    //   VoiceController.speak(text, 'consultation')  → 使用预定义场景
    //   VoiceController.speak(text, {speed:0.72, pitch:0.78, scenario:'welcome'}) → 患者专属音色
    let cfg, scenario;
    if (typeof scenarioOrProfile === 'object') {
      cfg = { speed: scenarioOrProfile.speed ?? 0.95, pitch: scenarioOrProfile.pitch ?? 0.92 };
      scenario = scenarioOrProfile.scenario || 'answer';
    } else {
      scenario = scenarioOrProfile;
      cfg = this.SCENARIOS[scenario] || this.SCENARIOS.answer;
    }
    this._scenario = scenario;
    this._engine.speak(text, {
      speed: cfg.speed,
      pitch: cfg.pitch,
      onEnd: () => { this._state = 'idle'; this._syncPlaybackUI(); }
    });
    this._state = 'playing';
    this._syncPlaybackUI();
    this._startMouthAnim();
  },

  pause() {
    if (!this._engine || this._state !== 'playing') return;
    this._engine.pause();
    this._state = 'paused';
    this._syncPlaybackUI();
  },

  resume() {
    if (!this._engine || this._state !== 'paused') return;
    this._engine.resume();
    this._state = 'playing';
    this._syncPlaybackUI();
  },

  stop() {
    if (!this._engine) return;
    this._engine.stop();
    this._state = 'idle';
    this._syncPlaybackUI();
    this._stopMouthAnim();
  },

  togglePlayPause() {
    if (this._state === 'playing') this.pause();
    else if (this._state === 'paused') this.resume();
  },

  toggleMute() {
    if (!this._engine) return;
    this._engine.toggleMute();
    this._syncPlaybackUI();
  },

  // ========== ASR ==========

  toggleListening() {
    if (!this._asr || !this._asr.isSupported) return;
    if (this._asr.isListening) {
      this._asr.stop();
    } else {
      this._asr.start({ lang: 'zh-CN' });
      this._updateListeningUI(true);
    }
  },

  _handleASRResult(text) {
    if (!text || !text.trim()) return;
    const input = document.getElementById('queryInput');
    if (input) {
      input.value = text.trim();
      input.classList.remove('interim');
    }
    this._updateListeningUI(false);
    setTimeout(() => {
      if (typeof sendMessage === 'function') sendMessage();
    }, 400);
  },

  _handleASRInterim(text) {
    const input = document.getElementById('queryInput');
    if (input) {
      input.value = text;
      input.classList.add('interim');
    }
  },

  _handleASRError(err) {
    this._updateListeningUI(false);
    if (err.type === 'permission') {
      alert(err.msg);
      const mic = document.getElementById('micBtn');
      if (mic) mic.classList.add('denied');
    } else if (err.type === 'no-device') {
      alert(err.msg);
    } else if (err.type === 'no-input') {
      const input = document.getElementById('queryInput');
      if (input) {
        const orig = input.placeholder;
        input.placeholder = '未检测到语音，请重试或直接输入文字';
        setTimeout(() => { input.placeholder = orig; }, 2500);
      }
    }
  },

  // ========== UI Sync ==========

  _syncPlaybackUI() {
    const muteBtn = document.getElementById('pbMute');
    if (muteBtn && this._engine) {
      const m = this._engine.isMuted;
      muteBtn.textContent = m ? '🔇' : '🔊';
      m ? muteBtn.classList.add('muted') : muteBtn.classList.remove('muted');
    }
  },

  _updateListeningUI(active) {
    const mic = document.getElementById('micBtn');
    const bar = document.getElementById('listeningBar');
    if (mic) active ? mic.classList.add('listening') : mic.classList.remove('listening');
    if (bar) bar.style.display = active ? 'block' : 'none';
  },

  _startMouthAnim() {
    const wrap = document.getElementById('mascotWrap');
    if (!wrap) return;
    wrap.classList.add('speaking', 'scenario-' + (this._scenario || 'answer'));
    wrap.classList.remove('paused');
  },

  _stopMouthAnim() {
    const wrap = document.getElementById('mascotWrap');
    if (!wrap) return;
    wrap.classList.remove('speaking', 'paused', 'scenario-welcome', 'scenario-consultation', 'scenario-answer');
  }
};

// 全局 TTS 引擎 — 浏览器内置语音
let ttsEngine = new BrowserSpeechEngine();

// ============================================================
//  欢迎语自动播放流程
//  优先 VITS 离线引擎 → 失败自动降级到浏览器内置语音
//  1. 页面加载后初始化引擎，VITS 失败则自动切换 BrowserSpeech
//  2. 浏览器语音无需用户交互即可预热（但仍需首次交互解除 autoplay 限制）
//  3. 首次用户交互时自动播放欢迎语
// ============================================================
let welcomeVoicePlayed = false;
let engineReady = false;

const WELCOME_TEXT = '你好，我是优优，你的陪诊小助手，有什么需要帮助的吗';

// ============================================================
//  Session & Conversation Persistence
// ============================================================
const SESSION_KEY = 'peiyoujia_session_id';
const HISTORY_KEY = 'peiyoujia_chat_history';
const MAX_STORED_MSGS = 50;

function getSessionId() {
  let sid = localStorage.getItem(SESSION_KEY);
  if (!sid) {
    sid = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem(SESSION_KEY, sid);
  }
  return sid;
}

function saveMessages() {
  const msgsEl = document.getElementById('messages');
  const msgDivs = msgsEl.querySelectorAll('.msg');
  const history = [];
  msgDivs.forEach(div => {
    const role = div.classList.contains('user') ? 'user' : 'assistant';
    const contentEl = div.querySelector('.msg-content');
    const text = contentEl ? contentEl.textContent.trim() : '';
    if (text && text.length < 2000) {
      history.push({ role, text });
    }
  });
  // keep last N
  const trimmed = history.slice(-MAX_STORED_MSGS);
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
  } catch(e) { /* quota exceeded, ignore */ }
}

function restoreMessages() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (!raw) return;
    const history = JSON.parse(raw);
    if (!history || !history.length) return;
    const msgs = document.getElementById('messages');
    const welcome = msgs.querySelector('.welcome');
    if (welcome) welcome.remove();
    document.getElementById('homeBtn').classList.add('visible');
    history.forEach(h => {
      addMessage(h.role, h.text, false, false);
    });
  } catch(e) { /* ignore */ }
}

function getRecentHistory(n) {
  const msgsEl = document.getElementById('messages');
  const msgDivs = msgsEl.querySelectorAll('.msg');
  const history = [];
  msgDivs.forEach(div => {
    const role = div.classList.contains('user') ? 'user' : 'assistant';
    const contentEl = div.querySelector('.msg-content');
    const text = contentEl ? contentEl.textContent.trim().substring(0, 300) : '';
    if (text) history.push({ role, text });
  });
  return history.slice(-(n * 2));
}

function tryAutoWelcome() {
  if (welcomeVoicePlayed) return;
  if (!engineReady) {
    setTimeout(tryAutoWelcome, 300);
    return;
  }
  welcomeVoicePlayed = true;
  ttsEngine._hideFallbackBtn();
  ttsEngine.speak(WELCOME_TEXT, { speed: 0.95 });
}

/** 播放欢迎语（需在用户手势中调用以通过浏览器 autoplay 策略） */
function playWelcomeNow() {
  if (welcomeVoicePlayed) return;
  welcomeVoicePlayed = true;
  ttsEngine._hideFallbackBtn();
  // 小延迟确保 AudioContext/speechSynthesis 在用户手势上下文中
  setTimeout(() => {
    ttsEngine.speak(WELCOME_TEXT, { speed: 0.95 });
  }, 100);
}

function onFallbackBtnClick() {
  ttsEngine.ensureAudioContext();
  AudioUnlockManager.prime();
  AudioUnlockManager.setUnlocked();
  welcomeVoicePlayed = false;
  tryAutoWelcome();
}

// ========== 页面加载序列 ==========
(async function bootstrap() {
  // 直接用浏览器内置语音（零延迟，稳定可靠）
  const browserEngine = new BrowserSpeechEngine();
  await browserEngine.init();
  ttsEngine = browserEngine;
  engineReady = true;
  VoiceController.init(ttsEngine);
  console.log('[Bootstrap] ✅ 浏览器语音引擎就绪');

  // ASR 不可用时隐藏麦克风按钮
  const micBtn = document.getElementById('micBtn');
  if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
    if (micBtn) micBtn.style.display = 'none';
    console.log('[Bootstrap] ⚠ SpeechRecognition 不可用，已隐藏语音输入');
  }

  // 恢复上次会话的对话历史
  if (!window._historyRestored) {
    window._historyRestored = true;
    restoreMessages();
  }

  // 加载每日健康小贴士
  setTimeout(loadHealthTip, 2000);
})();

// 全局首次用户交互 → 仅解锁浏览器音频（不自动播放）
['click', 'touchstart', 'keydown'].forEach(function(evt) {
  document.addEventListener(evt, function onFirstInteraction() {
    AudioUnlockManager.prime();
    AudioUnlockManager.setUnlocked();
    ttsEngine.ensureAudioContext();
  }, { once: true });
});

// 点击吉祥物 → 暂停/恢复/播放欢迎语
document.getElementById('mascotWrap').addEventListener('click', function(e) {
  e.stopPropagation();
  AudioUnlockManager.prime();
  AudioUnlockManager.setUnlocked();

  // 确保音频上下文在用户手势中激活
  if (ttsEngine && typeof ttsEngine.ensureAudioContext === 'function') {
    ttsEngine.ensureAudioContext();
  }

  if (VoiceController._state === 'playing') {
    VoiceController.pause();
  } else if (VoiceController._state === 'paused') {
    VoiceController.resume();
  } else {
    // 播放欢迎语：优先 VoiceController，降级直接调引擎，再降级裸 speechSynthesis
    if (ttsEngine && (ttsEngine.ready || ttsEngine.isReady)) {
      VoiceController.speak(WELCOME_TEXT, 'welcome');
    } else if (ttsEngine && typeof ttsEngine.speak === 'function') {
      try { ttsEngine.speak(WELCOME_TEXT, { speed: 0.95 }); } catch(_) {}
    } else if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(WELCOME_TEXT);
      u.lang = 'zh-CN'; u.rate = 0.9;
      speechSynthesis.speak(u);
    }
  }
});

// ============================================================
//  业务逻辑（保持不变）
// ============================================================

  // Save welcome HTML to restore later
  const welcomeHTML = document.getElementById('messages').innerHTML;

  // Load stats
  fetch('/api/stats')
    .then(r => r.json())
    .then(s => {
      document.getElementById('stats').innerHTML = `
        <span><span class="stat-dot green"></span>${s.diseases.toLocaleString()} 疾病</span>
        <span>${s.symptoms.toLocaleString()} 症状</span>
        <span>${s.drugs.toLocaleString()} 药品</span>
        <span>${(s.qa_pairs/1e4).toFixed(0)}万 QA</span>
      `;
    });

  function clearWelcome() {
    const msgs = document.getElementById('messages');
    const welcome = msgs.querySelector('.welcome');
    if (welcome) {
      welcome.remove();
      document.getElementById('homeBtn').classList.add('visible');
    }
    document.getElementById('queryInput').focus();
  }

  function addMessage(role, content, isHTML = false, skipSave = false) {
    const msgs = document.getElementById('messages');
    // Remove welcome if exists
    const welcome = msgs.querySelector('.welcome');
    if (welcome) {
      welcome.remove();
      document.getElementById('homeBtn').classList.add('visible');
    }

    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' +
                    now.getMinutes().toString().padStart(2,'0');

    const div = document.createElement('div');
    div.className = 'msg ' + role;

    if (role === 'user') {
      div.innerHTML = `
        <div class="msg-avatar">👤</div>
        <div class="msg-content">
          ${isHTML ? content : escapeHtml(content)}
          <span class="msg-time">${timeStr}</span>
        </div>
      `;
    } else {
      div.innerHTML = `
        <div class="msg-avatar"><img src="/static/logo.jpg" style="width:100%;height:100%;border-radius:50%;object-fit:cover"></div>
        <div class="msg-content">
          <button class="copy-btn" onclick="copyMsgContent(this)" title="复制">📋 复制</button>
          ${isHTML ? content : escapeHtml(content)}
          <span class="msg-time">${timeStr}</span>
          <div class="feedback-row">
            <span style="color:#94a3b8;">有帮助吗？</span>
            <button class="fb-btn" onclick="sendFeedback(this,'good')">👍</button>
            <button class="fb-btn" onclick="sendFeedback(this,'bad')">👎</button>
          </div>
        </div>
      `;
    }
    msgs.appendChild(div);
    // Smooth scroll to bottom
    msgs.scrollTo({ top: msgs.scrollHeight, behavior: 'smooth' });

    if (!skipSave) saveMessages();
    return div;
  }

  function sendFeedback(btn, rating) {
    const row = btn.parentElement;
    // Mark active
    row.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('active', 'good', 'bad'));
    btn.classList.add('active', rating);

    // Send feedback to server (fire and forget)
    const msgDiv = btn.closest('.msg');
    const contentEl = msgDiv ? msgDiv.querySelector('.msg-content') : null;
    const clone = contentEl ? contentEl.cloneNode(true) : null;
    if (clone) {
      clone.querySelectorAll('.copy-btn, .feedback-row, .msg-time').forEach(el => el.remove());
    }
    const text = clone ? (clone.textContent || '').trim().substring(0, 100) : '';

    fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: text,
        rating: rating,
        session_id: getSessionId()
      })
    }).catch(() => {});
  }

  function copyMsgContent(btn) {
    const contentEl = btn.parentElement;
    // Get text without the button text
    const clone = contentEl.cloneNode(true);
    const btnClone = clone.querySelector('.copy-btn');
    if (btnClone) btnClone.remove();
    const timeClone = clone.querySelector('.msg-time');
    if (timeClone) timeClone.remove();
    const text = (clone.textContent || '').trim();

    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✅ 已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 复制';
        btn.classList.remove('copied');
      }, 2000);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.textContent = '✅ 已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 复制';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  function renderSuggestions(suggestions) {
    const wrap = document.getElementById('suggestionsWrap');
    if (!wrap) return;
    wrap.innerHTML = '';
    if (!suggestions || !suggestions.length) return;
    suggestions.forEach(s => {
      const chip = document.createElement('span');
      chip.className = 'suggest-chip';
      chip.textContent = s;
      chip.onclick = () => {
        document.getElementById('queryInput').value = s;
        sendMessage();
      };
      wrap.appendChild(chip);
    });
  }

  function exportConversation() {
    const msgsEl = document.getElementById('messages');
    const msgDivs = msgsEl.querySelectorAll('.msg');
    if (!msgDivs.length) return;

    let text = '========== 陪优佳对话记录 ==========\n';
    text += '导出时间: ' + new Date().toLocaleString() + '\n\n';

    msgDivs.forEach(div => {
      const role = div.classList.contains('user') ? '用户' : '陪优佳助手';
      const contentEl = div.querySelector('.msg-content');
      if (!contentEl) return;
      // Clone to remove buttons and feedback
      const clone = contentEl.cloneNode(true);
      clone.querySelectorAll('.copy-btn, .feedback-row, .msg-time').forEach(el => el.remove());
      const content = (clone.textContent || '').trim();
      if (content) {
        text += '[' + role + '] ' + new Date().toLocaleString() + '\n';
        text += content + '\n\n';
      }
    });

    text += '========== 由陪优佳生成 ==========\n';

    const blob = new Blob(['﻿' + text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'peiyoujia-chat-' + new Date().toISOString().slice(0, 10) + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  }

  function goHome() {
    ttsEngine.stop();
    // 重置所有模拟和考核状态，确保重新进入时开启新对话
    examActive = false;
    examIndex = 0;
    simActive = false;
    simPatient = null;
    simStage = 0;
    simPending = false;
    const msgs = document.getElementById('messages');
    msgs.innerHTML = welcomeHTML;
    document.getElementById('homeBtn').classList.remove('visible');
    document.getElementById('queryInput').placeholder = '描述你要陪诊的场景，如：我妈妈头晕乏力该挂什么科...';
    renderSuggestions([]);
    // 清除本地存储的对话历史
    try { localStorage.removeItem(HISTORY_KEY); } catch(e) {}
  }

  function setQueryAndSend(q) {
    document.getElementById('queryInput').value = q;
    sendMessage();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
  }

  function formatBotReply(data) {
    let html = '';
    const aspect = data.aspect || 'general';

    // ── 聚焦模式：用户问了具体方面（饮食/运动/用药/生活/预防/护理）──
    if (aspect !== 'general' && data.diseases && data.diseases.length > 0) {
      return formatFocusedReply(data, aspect);
    }

    // ── 纯药品查询模式：用户输入了药品名，展示用药解读 ──
    if (data.is_pure_drug && data.drugs && data.drugs.length > 0) {
      return formatDrugReply(data);
    }

    // ── 症状/药品匹配但无疾病时的降级 ──
    if (!data.diseases && data.drugs && data.drugs.length > 0) {
      return formatDrugReply(data);
    }

    // ── 疾病对比按钮（当找到 2+ 个疾病时）──
    if (data.diseases && data.diseases.length >= 2) {
      const d1 = data.diseases[0].name;
      const d2 = data.diseases[1].name;
      html += `<div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;">
        <span style="font-size:11px;color:#94a3b8;">🔍 找到 ${data.diseases.length} 个相关疾病：</span>
        <button onclick="compareDiseases('${escapeHtml(d1)}','${escapeHtml(d2)}')"
          style="font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid rgba(96,165,250,0.3);background:rgba(96,165,250,0.1);color:#60a5fa;cursor:pointer;">
          ⚖ 对比「${escapeHtml(d1)}」vs「${escapeHtml(d2)}」
        </button>
      </div>`;
    }

    // ── 通用模式：完整的疾病卡片 ──
    // Department recommendations (陪诊科室推荐)
    if (data.departments && data.departments.length > 0) {
      html += '<div class="disease-name">🏥 陪诊科室推荐</div>';
      data.departments.forEach((dept, i) => {
        html += `<br>● <strong>${escapeHtml(dept.department)}</strong>`;
        if (dept.matched_symptoms && dept.matched_symptoms.length) {
          html += `<br><span style="font-size:13px;color:#ffffff;">&nbsp;&nbsp; 匹配症状：${escapeHtml(dept.matched_symptoms.join('、'))}</span>`;
        }
        if (dept.diseases && dept.diseases.length) {
          html += `<br><span style="font-size:13px;color:#ffffff;">&nbsp;&nbsp; 可能相关疾病：${escapeHtml(dept.diseases.join('、'))}</span>`;
        }
      });
      if (data.symptoms || data.diseases) html += '<hr class="divider">';
    }

    // Disease results
    if (data.diseases && data.diseases.length > 0) {
      data.diseases.forEach((d, i) => {
        if (i > 0) html += '<hr class="divider">';
        html += `<div class="disease-name">🩺 ${escapeHtml(d.name)}</div>`;
        if (d.similarity < 1) {
          html += `<span style="font-size:12px;color:#ffffff;">模糊匹配 相似度: ${d.similarity}</span><br>`;
        }
        if (d.category) {
          html += `<span class="field-label">📂 分类：</span>${escapeHtml(d.category.join(' › '))}<br>`;
        }
        if (d.desc) {
          html += `<span class="field-label">📝 概述：</span>${escapeHtml(d.desc)}<br>`;
        }
        if (d.symptom && d.symptom.length) {
          html += `<span class="field-label">🤒 症状：</span>${escapeHtml(d.symptom.slice(0,10).join('、'))}<br>`;
        }
        if (d.cause) {
          html += `<span class="field-label">🔬 病因：</span>${escapeHtml(d.cause)}<br>`;
        }
        if (d.cure_department && d.cure_department.length) {
          html += `<span class="field-label">🏥 就诊科室：</span>${escapeHtml(d.cure_department.join('、'))}<br>`;
        }
        if (d.check && d.check.length) {
          html += `<span class="field-label">🔍 检查项目：</span>${escapeHtml(d.check.slice(0,8).join('、'))}<br>`;
        }
        if (d.cure_way && d.cure_way.length) {
          html += `<span class="field-label">💉 治疗方式：</span>${escapeHtml(d.cure_way.slice(0,6).join('、'))}<br>`;
        }
        if (d.recommand_drug && d.recommand_drug.length) {
          html += `<span class="field-label">💊 推荐药品：</span>${escapeHtml(d.recommand_drug.slice(0,8).join('、'))}<br>`;
        }
        if (d.drug_detail && d.drug_detail.length) {
          html += `<span class="field-label">📋 用药详情：</span>${escapeHtml(d.drug_detail.slice(0,5).join('；'))}<br>`;
        }
        if (d.cured_prob) {
          html += `<span class="field-label">✅ 治愈概率：</span>${escapeHtml(d.cured_prob)}<br>`;
        }
        if (d.cure_lasttime) {
          html += `<span class="field-label">⏱ 治疗周期：</span>${escapeHtml(d.cure_lasttime)}<br>`;
        }
        if (d.prevent) {
          html += `<span class="field-label">🛡 预防措施：</span>${escapeHtml(d.prevent)}<br>`;
        }
        if (d.acompany && d.acompany.length) {
          html += `<span class="field-label">⚠ 并发症：</span>${escapeHtml(d.acompany.slice(0,8).join('、'))}<br>`;
        }
        if (d.get_prob) {
          html += `<span class="field-label">📊 发病率：</span>${escapeHtml(d.get_prob)}<br>`;
        }
        if (d.yibao_status) {
          html += `<span class="field-label">🏛 医保状态：</span>${escapeHtml(d.yibao_status)}<br>`;
        }
      });
    }

    // Symptom results
    if (data.symptoms && data.symptoms.length > 0 && !data.diseases) {
      html += '<div class="disease-name">🤒 症状关联的可能疾病</div>';
      data.symptoms.forEach(s => {
        html += `<br>● <strong>${escapeHtml(s.disease)}</strong>（症状：${escapeHtml(s.matched_symptom)}）`;
        if (s.cure_department && s.cure_department.length) {
          html += `<br><span style="font-size:13px;color:#60a5fa;">&nbsp;&nbsp; 🏥 建议就诊科室：${escapeHtml(s.cure_department.join('、'))}</span>`;
        }
        if (s.desc) html += `<br><span style="font-size:13px;color:#ffffff;">&nbsp;&nbsp; ${escapeHtml(s.desc)}</span>`;
      });
    }

    // Drug results
    if (data.drugs && data.drugs.length > 0 && !data.diseases) {
      html += '<div class="disease-name">💊 药品关联疾病</div>';
      data.drugs.forEach(d => {
        html += `<br>● <strong>${escapeHtml(d.disease)}</strong>（匹配：${escapeHtml(d.matched_drug)}）`;
        if (d.desc) html += `<br><span style="font-size:13px;color:#ffffff;">&nbsp;&nbsp; ${escapeHtml(d.desc)}</span>`;
      });
    }

    // QA results
    if (data.qa && data.qa.length > 0 && !data.diseases && !data.symptoms && !data.drugs) {
      html += '<div class="disease-name">💬 相关医疗问答</div>';
      data.qa.forEach((item, i) => {
        html += `<br><strong>[${i+1}]</strong> <span style="color:#ffffff;">${escapeHtml(item.question.slice(0,150))}</span>`;
        html += `<br><span style="color:#60a5fa;">答：${escapeHtml(item.answer.slice(0,500))}</span>`;
      });
    }

    // Terms
    if (data.terms && data.terms.length > 0 && !data.diseases) {
      html += `<div class="disease-name">📋 相关术语 (${data.terms.length})</div>`;
      html += `<br>${data.terms.map(t => '● ' + escapeHtml(t)).join('<br>')}`;
    }

    // No results
    if (!data.found) {
      html = `😷 未找到匹配结果<br><br>
        <strong>建议这样问陪诊助手：</strong><br>
        ● 描述症状帮您推荐科室，如"头晕乏力挂什么科"<br>
        ● 输入具体疾病名，如"糖尿病"、"高血压"<br>
        ● 输入症状关键词，如"头痛"、"发热"<br>
        ● 输入药品名，如"二甲双胍"<br>
        ● 询问陪诊相关问题，如"带家人复查要准备什么"`;
    }

    // 附加对话链引导
    if (data.conversation_chain && data.conversation_chain.has_chain) {
      html += '<hr class="divider"><div style="margin-top:8px;"><span class="field-label">💬 深入了解：</span></div>';
      data.conversation_chain.steps.forEach(function(step, i) {
        if (i < 4) {
          var safeQ = step.question.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
          var safeTitle = step.title.replace(/'/g, '&#39;');
          var safeContent = step.content.substring(0, 80).replace(/'/g, '&#39;');
          html += '<button onclick=\"setQueryAndSend(&#39;' + safeQ + '&#39;)\" style=\"display:block;width:100%;text-align:left;margin:4px 0;padding:8px 12px;border:1px solid rgba(96,165,250,0.2);border-radius:8px;background:rgba(96,165,250,0.05);color:#e2e8f0;cursor:pointer;font-size:13px;transition:all .15s;\" onmouseover=\"this.style.background=\'rgba(96,165,250,0.15)\'\" onmouseout=\"this.style.background=\'rgba(96,165,250,0.05)\'\">' +
            step.icon + ' <strong>' + escapeHtml(safeTitle) + '</strong>: ' + escapeHtml(safeContent) + '...<br>' +
            '<span style=\"font-size:11px;color:#60a5fa;\">&#x1F449; ' + escapeHtml(step.question) + '</span></button>';
        }
      });
    }

    return html;
  }

  // ── 药品解读回复：纯药品名查询的专属展示 ──
  function formatDrugReply(data) {
    let html = '';
    const queryName = escapeHtml(data.query || '');
    html += `<div class="disease-name">💊 药品解读：${queryName}</div>`;
    html += '<hr class="divider">';

    // 1) 关联疾病
    if (data.drugs && data.drugs.length > 0) {
      html += '<div><span class="field-label">🏥 关联疾病：</span></div>';
      const seen = new Set();
      for (const d of data.drugs) {
        const key = d.disease;
        if (!seen.has(key) && seen.size < 5) {
          seen.add(key);
          html += `<div style="margin:4px 0 4px 12px;font-size:13px;color:#e2e8f0;">● <strong>${escapeHtml(d.disease)}</strong>`;
          if (d.desc) html += ` — ${escapeHtml(d.desc.slice(0, 80))}`;
          html += '</div>';
        }
      }
    }

    // 2) 如果有对应疾病，展示用药详情
    if (data.diseases && data.diseases.length > 0) {
      const disease = data.diseases[0];
      if (disease.drug_detail && disease.drug_detail.length > 0) {
        html += '<hr class="divider">';
        html += '<div><span class="field-label">📋 用药详情：</span></div>';
        for (const dd of disease.drug_detail.slice(0, 5)) {
          html += `<div style="margin:3px 0 3px 12px;font-size:13px;color:#e2e8f0;">● ${escapeHtml(String(dd))}</div>`;
        }
      }
      if (disease.recommand_drug && disease.recommand_drug.length > 0) {
        html += '<hr class="divider">';
        html += `<div><span class="field-label">💊 同类常用药物：</span>${escapeHtml(disease.recommand_drug.slice(0, 8).join('、'))}</div>`;
      }
      // 预防信息通常包含用药注意事项
      if (disease.prevent && disease.prevent.trim()) {
        html += '<hr class="divider">';
        html += `<div style="line-height:1.8;font-size:14px;color:#e2e8f0;">${escapeHtml(disease.prevent)}</div>`;
      }
    }

    // 3) 知识库 QA
    if (data.qa && data.qa.length > 0) {
      html += '<hr class="divider">';
      html += '<div style="font-size:13px;color:#94a3b8;margin-bottom:8px;">📚 用药知识：</div>';
      let shown = 0;
      for (const item of data.qa) {
        if (shown >= 3) break;
        html += `<div style="margin-top:8px;padding:8px 12px;background:rgba(96,165,250,0.08);border-radius:8px;font-size:13px;line-height:1.6;">`;
        html += `<div style="color:#60a5fa;">❓ ${escapeHtml(item.question.slice(0, 120))}</div>`;
        html += `<div style="color:#e2e8f0;margin-top:3px;">💬 ${escapeHtml(item.answer.slice(0, 300))}</div>`;
        html += '</div>';
        shown++;
      }
    }

    html += '<div style="margin-top:12px;font-size:11px;color:#64748b;">⚠ 以上信息来自医学知识库，仅供参考。用药请务必遵医嘱，不可自行调整剂量或停药。</div>';
    return html;
  }

  // ── 聚焦回复：用户问了具体健康方面，智能过滤无关信息 ──
  const ASPECT_LABELS = {
    diet:      { icon: '🥗', title: '饮食建议',   hint: '以下是针对您问题的饮食指导' },
    exercise:  { icon: '🏃', title: '运动建议',   hint: '以下是针对您问题的运动指导' },
    medication:{ icon: '💊', title: '用药指导',   hint: '以下是针对您问题的用药说明' },
    lifestyle: { icon: '🌿', title: '生活建议',   hint: '以下是针对您问题的生活指导' },
    prevention:{ icon: '🛡️', title: '预防建议',   hint: '以下是针对您问题的预防措施' },
    daily_care:{ icon: '🏠', title: '日常护理',   hint: '以下是针对您问题的护理建议' },
  };

  function formatFocusedReply(data, aspect) {
    let html = '';
    const disease = data.diseases[0];
    const label = ASPECT_LABELS[aspect] || { icon: '💡', title: '健康建议', hint: '' };
    const diseaseName = escapeHtml(disease.name);

    // 标题行：聚焦于用户问的方面
    html += `<div class="disease-name">${label.icon} ${diseaseName} — ${label.title}</div>`;
    if (label.hint) {
      html += `<span style="font-size:13px;color:#94a3b8;">${label.hint}</span>`;
    }
    html += '<hr class="divider">';

    // 1) 疾病的预防/养护信息（prevent 字段通常包含饮食运动等建议）
    if (disease.prevent && disease.prevent.trim()) {
      html += `<div style="line-height:1.8;font-size:14px;color:#e2e8f0;">${escapeHtml(disease.prevent)}</div>`;
      html += '<hr class="divider">';
    }

    // 2) 根据方面补充相应字段
    if (aspect === 'diet' && disease.desc) {
      // 疾病概述做简短背景
      html += `<div style="font-size:12px;color:#94a3b8;line-height:1.6;">📋 背景参考：${escapeHtml(disease.desc.slice(0, 200))}...</div>`;
    }

    if (aspect === 'medication') {
      // 优先展示用药详情（而非疾病症状）
      if (disease.drug_detail && disease.drug_detail.length > 0) {
        html += '<div style="margin-top:8px;"><span class="field-label">📋 相关药品详情：</span></div>';
        for (const dd of disease.drug_detail.slice(0, 5)) {
          html += `<div style="margin:3px 0 3px 12px;font-size:13px;color:#e2e8f0;">● ${escapeHtml(String(dd))}</div>`;
        }
      }
      if (disease.recommand_drug && disease.recommand_drug.length > 0) {
        html += `<div style="margin-top:8px;"><span class="field-label">💊 常用药物：</span>${escapeHtml(disease.recommand_drug.slice(0, 8).join('、'))}</div>`;
      }
      // 用法相关预防信息
      if (disease.prevent && disease.prevent.trim()) {
        html += '<hr class="divider">';
        html += `<div style="font-size:12px;color:#94a3b8;margin-bottom:4px;">📝 用药注意事项：</div>`;
        html += `<div style="line-height:1.8;font-size:14px;color:#e2e8f0;">${escapeHtml(disease.prevent)}</div>`;
      }
    }

    if (aspect === 'exercise' && disease.cure_way && disease.cure_way.length > 0) {
      html += `<div style="margin-top:8px;"><span class="field-label">🏥 治疗方式参考：</span>${escapeHtml(disease.cure_way.slice(0, 5).join('、'))}</div>`;
    }

    if (aspect === 'prevention') {
      if (disease.cause) {
        html += `<div style="margin-top:8px;"><span class="field-label">🔬 病因：</span>${escapeHtml(disease.cause.slice(0, 200))}</div>`;
      }
      if (disease.acompany && disease.acompany.length > 0) {
