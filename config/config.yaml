# 知途伴学配置（三级合并：config.yaml < 环境变量 < 运行时覆盖）
llm:
  provider: mock            # mock（离线默认）| spark（讯飞开放平台星火 Lite，Key 放 .env）
  base_url: "https://spark-api-open.xf-yun.com/v1"   # 星火 Lite OpenAI 兼容接口（免费档）
  api_key: ""               # 环境变量 LLM_API_KEY 可覆盖
  model: "lite"             # Spark Lite 永久免费档（QPS 2，2026-09-14 验证通过）
  temperature: 0.7
  max_tokens: 2048          # 显式设上限，防止单次调用生成过长拖慢交互

paths:
  kg: data/kg/ml_kg.json
  questions: data/kg/questions.json
  db: data/zhitu.db

database:
  wal: true
